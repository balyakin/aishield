version: 2

project_name: aishield

before:
  hooks:
    - go mod tidy

builds:
  - id: aishield
    main: ./cmd/aishield
    binary: aishield
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/balyakin/aishield/internal/cli.version={{.Version}} -X github.com/balyakin/aishield/internal/cli.commit={{.Commit}} -X github.com/balyakin/aishield/internal/cli.date={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
